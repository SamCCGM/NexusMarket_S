# Application
spring.application.name=nexusmarket
server.port=8080

# MySQL Configuration (Primary Database for Relational Data)
spring.datasource.url=jdbc:mysql://localhost:3306/nexusmarket?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# MongoDB Configuration (For Document-based Data: Cart, Inventory, Logs, etc.)
spring.data.mongodb.uri=mongodb://localhost:27017/nexusmarket_mongo
spring.data.mongodb.auto-index-creation=true

# Spring Security
spring.security.user.name=admin
spring.security.user.password=admin123

# JWT Configuration
app.jwt.secret=nexusMarketSecretKeyForJWTTokenGeneration2024SecureAndLongEnoughForHS256
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Actuator / Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE